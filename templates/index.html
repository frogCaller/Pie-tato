<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)">
<title>gpi-media</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2360aae4'/%3E%3Crect x='7' y='9' width='18' height='12' rx='2.5' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='m14 12.5 4 2.5-4 2.5z' fill='white'/%3E%3C/svg%3E">
<style>
  /* Atkinson Hyperlegible (Braille Institute; SIL Open Font License, static/fonts/OFL.txt):
     letters that can't be mistaken for each other, read from across the room */
  @font-face {
    font-family: "Hyperlegible"; font-style: normal; font-weight: 200 800; font-display: swap;
    src: url(static/fonts/next-latin.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Hyperlegible"; font-style: normal; font-weight: 200 800; font-display: swap;
    src: url(static/fonts/next-latin-ext.woff2) format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  /* An evening room, lit by the TV: the page is the room, the library is the one surface in it,
     and the only colour that isn't yours (the accent from the Pi's settings) is the TV's own glow. */
  :root {
    --room: #17151b; --surface: #201e25; --surface-2: #26232c; --raised: #2e2a35;
    --hover: rgba(255, 255, 255, .055); --press: rgba(255, 255, 255, .1);
    --line: rgba(255, 255, 255, .07); --line-2: rgba(255, 255, 255, .11); --line-3: rgba(255, 255, 255, .2);
    --text: #f4f1f7; --body: #c6c1cd; --muted: #9a94a3; --faint: #6f6a78;
    --accent: #60aae4; --accent-rgb: 96, 170, 228; --on-accent: #0d1620;
    --ok: #74c99d; --bad: #f08080; --bad-rgb: 240, 128, 128;
    --glow: 70, 90, 150; --glow-a: .55;
    --key: linear-gradient(#36323e, #2c2833);
    --key-edge: 0 1px 0 rgba(255, 255, 255, .07) inset, 0 6px 14px -8px rgba(0, 0, 0, .7);
    --top: 64px;
    --sans: "Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --room: #ecebf0; --surface: #fcfbfd; --surface-2: #f4f3f7; --raised: #e9e7ee;
      --hover: rgba(30, 24, 40, .05); --press: rgba(30, 24, 40, .09);
      --line: rgba(30, 24, 40, .08); --line-2: rgba(30, 24, 40, .12); --line-3: rgba(30, 24, 40, .22);
      --text: #1d1a23; --body: #403b49; --muted: #6c6676; --faint: #9a94a4;
      --on-accent: #ffffff; --ok: #1f8a5b; --bad: #cf3f45; --bad-rgb: 207, 63, 69;
      --glow-a: .34;
      --key: linear-gradient(#ffffff, #f3f2f6);
      --key-edge: 0 0 0 1px rgba(30, 24, 40, .1) inset, 0 6px 14px -9px rgba(30, 24, 40, .35);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; color: var(--text); background: var(--room); overflow-x: clip;
    font: 15px/1.45 var(--sans);
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--accent); text-underline-offset: 3px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg { display: block; flex: none; }
  h2 { margin: 0; font-size: 14px; font-weight: 650; color: var(--body); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

  /* ---- top bar ---- */
  .top {
    position: sticky; top: 0; z-index: 20; height: var(--top); display: flex; align-items: center; gap: 20px;
    padding: 0 28px; background: rgba(23, 21, 27, .86); background: color-mix(in srgb, var(--room) 86%, transparent);
    -webkit-backdrop-filter: saturate(140%) blur(14px); backdrop-filter: saturate(140%) blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
  .logo { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; color: var(--on-accent); background: var(--accent); }
  .who { min-width: 0; line-height: 1.25; }
  .who b { display: block; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); min-width: 0; }
  .status span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.on { background: var(--ok); }
  .dot.off { background: var(--bad); }
  .views { display: flex; gap: 4px; flex: none; }
  .vbtn {
    display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 8px 16px; border-radius: 999px;
    color: var(--muted); font-size: 15px; font-weight: 600;
  }
  .vbtn:hover { color: var(--text); background: var(--hover); }
  .vbtn[aria-current="true"] { background: var(--raised); color: var(--text); }
  .seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); flex: none; }
  .seg button { border: 0; background: none; padding: 5px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 550; color: var(--muted); white-space: nowrap; }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--raised); color: var(--text); box-shadow: 0 0 0 1px var(--line-2) inset; }

  main { max-width: 1720px; margin: 0 auto; padding: 28px; }

  /* ---- the screen, the player and the remote: things in the room, no boxes ---- */
  .screen { display: grid; grid-template-columns: 420px minmax(0, 1fr); gap: 36px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 26px; min-width: 0; }
  .tv-wrap { position: relative; isolation: isolate; }
  .glow {
    position: absolute; inset: -9% -3%; z-index: -1; border-radius: 50%; pointer-events: none;
    background-color: rgb(var(--glow)); opacity: var(--glow-a); filter: blur(56px);
    transition: background-color 1.6s ease, opacity 1.6s ease;
  }
  body.tv-dark .glow { opacity: calc(var(--glow-a) * .35); }
  .tv { position: relative; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: #000; }
  .tv::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: 0 0 0 1px rgba(255, 255, 255, .08) inset; pointer-events: none; }
  .tv img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .tv-msg {
    position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 6px; padding: 24px;
    text-align: center; color: #b3adbb; font-size: 14px; background: #0e0d11;
  }
  .tv-msg b { color: #fff; font-size: 16px; font-weight: 650; }
  .tv-msg button { margin-top: 10px; border: 0; border-radius: 999px; padding: 8px 18px; font-weight: 650; background: var(--accent); color: var(--on-accent); }
  .tv-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; }
  .player { margin-top: 18px; }
  .p-head { display: flex; align-items: flex-end; gap: 12px; }
  .p-text { flex: 1; min-width: 0; }
  .p-text b { display: block; font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p-text span { display: block; margin-top: 1px; font-size: 13.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p-time, .meta, .summary, .disk-text, .fold .n, .job .st, .overall, .ftabs .ltab .n { font-variant-numeric: tabular-nums; }
  .p-time { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .p-live { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--bad); }
  .p-live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .p-bar { margin: 12px 0 2px; height: 4px; border-radius: 2px; background: var(--line-2); overflow: hidden; }
  .p-bar i { display: block; height: 100%; width: 0; background: var(--text); border-radius: 2px; transition: width .5s linear; }
  .p-ctrls { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; }
  .pc { width: 44px; height: 44px; border-radius: 50%; border: 0; background: none; color: var(--body); display: grid; place-items: center; }
  .pc:hover { background: var(--hover); color: var(--text); }
  .pc.big { width: 58px; height: 58px; background: var(--text); color: var(--room); margin: 0 6px; }
  .pc.big:hover { background: var(--text); opacity: .88; }
  .p-extra { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
  .vol { display: flex; align-items: center; gap: 2px; }
  .lvl { width: 76px; height: 4px; border-radius: 2px; background: var(--line-2); overflow: hidden; margin: 0 6px; }
  .lvl i { display: block; height: 100%; background: var(--body); border-radius: 2px; }
  .p-right { display: flex; gap: 2px; }
  .pc.sm { width: 38px; height: 38px; }

  .remote { display: grid; justify-items: center; gap: 18px; user-select: none; -webkit-user-select: none; }
  .ring {
    --d: 228px; position: relative; width: var(--d); height: var(--d); border-radius: 50%;
    background: var(--key); box-shadow: var(--key-edge), 0 0 0 1px var(--line) inset;
  }
  .rk { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .ring .arrow {
    position: absolute; width: 72px; height: 72px; border: 0; border-radius: 50%; background: none;
    color: var(--muted); display: grid; place-items: center; transition: color .08s;
  }
  .ring .up { left: 50%; top: 2px; transform: translateX(-50%); }
  .ring .down { left: 50%; bottom: 2px; transform: translateX(-50%); }
  .ring .left { top: 50%; left: 2px; transform: translateY(-50%); }
  .ring .right { top: 50%; right: 2px; transform: translateY(-50%); }
  .ring .arrow:hover { color: var(--text); }
  .ring .arrow.held { color: var(--accent); }
  .ring .ok {
    position: absolute; left: 50%; top: 50%; width: 92px; height: 92px; transform: translate(-50%, -50%);
    border-radius: 50%; border: 0; background: var(--room); color: var(--text); font-weight: 700; font-size: 16px;
    box-shadow: 0 0 0 1px var(--line-2) inset, 0 2px 10px rgba(0, 0, 0, .25) inset;
    transition: background-color .08s, color .08s;
  }
  .ring .ok.held { background: rgba(var(--accent-rgb), .22); color: var(--accent); }
  .mainkeys { display: flex; gap: 12px; }
  .mk {
    display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 20px 0 16px; border-radius: 999px;
    border: 0; background: var(--key); box-shadow: var(--key-edge); color: var(--text); font-size: 15px; font-weight: 600;
  }
  .minikeys { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .kk {
    min-width: 40px; height: 34px; padding: 0 11px; border-radius: 10px; border: 0;
    background: var(--key); box-shadow: var(--key-edge); color: var(--body); font-size: 14px; font-weight: 650;
  }
  .kk.word { font-size: 13px; font-weight: 600; }
  .mk:hover, .kk:hover { color: var(--text); filter: brightness(1.08); }
  .mk.held, .kk.held { background: rgba(var(--accent-rgb), .22); color: var(--accent); box-shadow: 0 0 0 1px rgba(var(--accent-rgb), .5) inset; }
  .remote-card.off .remote .rk:not([data-b="home"]) { opacity: .35; pointer-events: none; }
  .kbd-hint { margin: 2px 0 0; text-align: center; font-size: 12.5px; color: var(--faint); }
  .pads { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); }
  .pads-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; font-size: 14px; }
  .linkbtn:hover { text-decoration: underline; text-underline-offset: 3px; }
  .pads ul { list-style: none; margin: 8px 0 0; padding: 0; }
  .pads li { display: flex; align-items: center; gap: 10px; padding: 4px 0; font-size: 14.5px; min-width: 0; }
  .pads li svg { color: var(--muted); }
  .pads .pn { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pads .k { margin-left: auto; color: var(--faint); font-size: 13px; white-space: nowrap; }
  .pads li.none { color: var(--muted); font-size: 13.5px; }
  .learn { margin-top: 10px; padding: 11px 13px; border-radius: 12px; background: rgba(var(--accent-rgb), .12); font-size: 14px; }
  .learn b { font-weight: 700; margin-right: 6px; }
  .learn small { display: block; margin-top: 2px; color: var(--muted); font-size: 13px; }
  .btn-row { display: flex; gap: 14px; }

  /* ---- the library: the one surface ---- */
  .library {
    display: flex; flex-direction: column; overflow: hidden; min-width: 0; background: var(--surface);
    border: 1px solid var(--line); border-radius: 22px;
    position: sticky; top: calc(var(--top) + 28px); height: calc(100vh - var(--top) - 56px); min-height: 520px;
  }
  .lib-top { display: flex; align-items: center; gap: 16px; padding: 0 16px 0 12px; border-bottom: 1px solid var(--line); flex: none; }
  .ltabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
  .ltabs::-webkit-scrollbar { display: none; }
  .ltab {
    position: relative; display: flex; align-items: center; gap: 7px; border: 0; background: none; padding: 17px 12px 15px;
    color: var(--muted); font-size: 15px; font-weight: 600; white-space: nowrap;
  }
  .ltab:hover { color: var(--text); }
  .ltab[aria-selected="true"] { color: var(--text); }
  .ltab[aria-selected="true"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--accent); }
  .search { position: relative; width: 260px; flex: none; }
  .search input {
    width: 100%; height: 38px; padding: 0 12px 0 36px; border-radius: 999px; border: 1px solid var(--line-2);
    background: var(--surface-2); font-size: 14.5px; outline: none;
  }
  .search input:focus { border-color: rgba(var(--accent-rgb), .7); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .16); }
  .search input::placeholder { color: var(--faint); }
  .search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
  .lib-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 216px minmax(0, 1fr); }
  .lib-body.flat { grid-template-columns: minmax(0, 1fr); }
  .lib-body.flat .side { display: none; }
  .side { border-right: 1px solid var(--line); padding: 12px 10px 16px; overflow-y: auto; min-height: 0; }
  .side .grp { padding: 16px 10px 6px; font-size: 12.5px; font-weight: 650; color: var(--faint); }
  .side .grp:first-child { padding-top: 4px; }
  .fold {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; padding: 8px 10px;
    border: 0; border-radius: 10px; background: none; color: var(--body); font-size: 14.5px; text-align: left;
  }
  .fold > span:not(.n) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fold:hover { background: var(--hover); color: var(--text); }
  .fold[aria-current="true"] { background: rgba(var(--accent-rgb), .15); color: var(--text); font-weight: 600; }
  .fold .n { font-size: 12.5px; font-weight: 400; color: var(--faint); }
  .content { min-width: 0; min-height: 0; overflow-y: auto; padding: 0 24px 28px; }
  .content-h {
    position: sticky; top: 0; z-index: 2; display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    padding: 18px 0 14px; background: linear-gradient(var(--surface) 78%, transparent);
  }
  .content-h > div { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .content-h h3 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .content-h .src { font-size: 13px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .content.apps-pad { padding-top: 22px; }

  .grid { display: grid; gap: 24px 16px; grid-template-columns: repeat(auto-fill, minmax(var(--min, 168px), 1fr)); }
  .grid.tiles { --min: 260px; gap: 10px; }
  .grid.apps { --min: 124px; gap: 6px; }
  .item {
    position: relative; display: flex; flex-direction: column; gap: 9px; text-align: left; background: none; border: 0;
    padding: 0; color: inherit; border-radius: 12px; min-width: 0;
  }
  .art { position: relative; aspect-ratio: 4 / 3; border-radius: 10px; overflow: hidden; background: var(--raised); }
  .art::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: 0 0 0 1px var(--line) inset; pointer-events: none; transition: box-shadow .12s; }
  .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .art .ph { position: absolute; inset: 0; display: grid; place-items: center; color: rgba(255, 255, 255, .62); font-size: 26px; font-weight: 700; }
  .go {
    position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%;
    display: grid; place-items: center; background: rgba(12, 10, 16, .62); color: #fff; opacity: 0; transition: opacity .12s;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); box-shadow: 0 0 0 1px rgba(255, 255, 255, .25) inset;
  }
  .item:hover .go, .item:focus-visible .go, .item.busy .go, .tile:hover .go2, .tile.busy .go2 { opacity: 1; }
  .item:hover .art::after { box-shadow: 0 0 0 2px rgba(var(--accent-rgb), .7) inset; }
  .item.busy .go svg, .tile.busy .go2 svg { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .item .t { font-size: 14.5px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item .s { margin-top: 3px; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item.on .art::after { box-shadow: 0 0 0 2px var(--accent) inset; }
  .item.on .t { color: var(--accent); }
  .chip-on { position: absolute; left: 8px; top: 8px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--accent); color: var(--on-accent); }
  .tile {
    position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr) 30px; gap: 12px; align-items: center;
    padding: 10px 10px 10px 12px; border-radius: 14px; background: none; border: 1px solid var(--line);
    text-align: left; color: inherit; min-width: 0;
  }
  .tile:hover { background: var(--hover); }
  .tile.on { border-color: rgba(var(--accent-rgb), .6); background: rgba(var(--accent-rgb), .09); }
  .tile.on .tt { color: var(--accent); }
  .tile .tt { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .ts { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .go2 { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--accent); background: rgba(var(--accent-rgb), .15); opacity: 0; transition: opacity .12s; }
  .tile.on .go2 { opacity: 1; }
  .mono { position: relative; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-weight: 700; font-size: 15px; color: #fff; overflow: hidden; }
  .mono img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #fff; padding: 3px; }
  .mono.round { border-radius: 50%; }
  .mono.round img { object-fit: cover; padding: 0; }
  .app {
    display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 8px 14px; border-radius: 16px;
    border: 0; background: none; text-align: center; color: inherit;
  }
  .app:hover { background: var(--hover); }
  .app img, .app .tile-i { width: 64px; height: 64px; border-radius: 17px; margin-bottom: 4px; box-shadow: 0 10px 20px -12px rgba(0, 0, 0, .7); }
  .app .tile-i { display: grid; place-items: center; background: var(--accent); color: var(--on-accent); }
  .app .an { font-weight: 650; font-size: 15px; }
  .app .aa { font-size: 12.5px; color: var(--muted); line-height: 1.35; max-width: 22ch; }

const S = {
  info: null, folder: "music", path: "", entries: [], dest: "auto", mode: "rename",
  jobs: [], running: false, samples: [], lastRefresh: 0, nextId: 1, view: "screen",

// ---- little helpers -------------------------------------------------------------
const store = {
  get(k, d) { try { const v = localStorage.getItem("gpi-media." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("gpi-media." + k, JSON.stringify(v)); } catch (e) {} },
};
const qs = (o) => Object.entries(o).map(([k, v]) => k + "=" + encodeURIComponent(v)).join("&");
const join = (a, b) => (a && b ? a + "/" + b : a || b || "");
const extOf = (n) => { const i = n.lastIndexOf("."); return i > 0 ? n.slice(i).toLowerCase() : ""; };
function fmtSize(n) {
  if (n < 1024) return n + " B";
  const u = ["KB", "MB", "GB", "TB"]; let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
  return (n >= 100 ? Math.round(n) : n.toFixed(1)) + " " + u[i];
}
function fmtDate(sec) {
  const d = new Date(sec * 1000), now = new Date();
  const o = { month: "short", day: "numeric" };
  if (d.getFullYear() !== now.getFullYear()) o.year = "numeric";
  return d.toLocaleDateString(undefined, o);
}
function fmtLeft(s) {
  if (!isFinite(s) || s <= 0) return "";
  if (s < 60) return "under a minute left";
  const m = Math.round(s / 60);
  return m < 60 ? m + " min left" : Math.floor(m / 60) + " h " + (m % 60) + " min left";
}
function fmtClock(s) {
  s = Math.max(0, Math.floor(s || 0));
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = String(s % 60).padStart(2, "0");
  return h ? h + ":" + String(m).padStart(2, "0") + ":" + ss : m + ":" + ss;
}
function rgbOf(hex) {
  const n = parseInt(hex.replace("#", ""), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;

}

const HUES = ["#4f7cc9", "#3c9a8c", "#8a6cc8", "#c06b8a", "#c47f4c", "#5a9756", "#4a8db5", "#b5604c", "#7279cf", "#3b8b77", "#a0794a", "#5e6fa8"];

}

function toast(msg) {

  t.textContent = msg; t.classList.add("show");

}

  try { data = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((data && data.error) || "The Pi said no (" + r.status + ")");
  if (data && data.error) throw new Error(data.error);
  return data;
}

}

function kindOf(name) {
  const ext = extOf(name);
  if (ext === ".pdf") return "pdf";
  for (const [k, exts] of Object.entries(S.info ? S.info.kinds : {})) if (exts.includes(ext)) return k;
  return "other";
}
function isSetting(name) {
  return !!(S.info && S.info.settingsFiles.includes(name.toLowerCase()));
}
function autoFolder(name) {
  if (isSetting(name)) return "settings";
  const k = kindOf(name);
  return k === "pdf" || k === "other" ? "documents" : k;
}

// ---- the Pi: name, colour, space ------------------------------------------------
async function loadInfo() {
  try {
    const info = await api("/api/info");
    S.info = info;
    $("#name").textContent = info.name;
    setTitle();
    setAccent(info.accent);
    drawDisk(); drawTabs();
  } catch (e) {
    toast("Can't reach the Pi: " + e.message);
  }
}
function setTitle() {
  document.title = (S.info ? S.info.name : "gpi-media") + (S.view === "files" ? " · files" : " · screen");
}
function luminance(rgb) {
  const f = (c) => { c /= 255; return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; };
  return 0.2126 * f(rgb[0]) + 0.7152 * f(rgb[1]) + 0.0722 * f(rgb[2]);
}

  let rgb = rgbOf(hex);

  }
  const [r, g, b] = rgb;
  const root = document.documentElement.style;
  root.setProperty("--accent", `rgb(${r}, ${g}, ${b})`);
  root.setProperty("--accent-rgb", `${r}, ${g}, ${b}`);
}
function drawDisk() {

  $("#meter").classList.toggle("low", d.free < d.total * 0.08);
}

// ---- views -------------------------------------------------------------------------
function showView(v) {

}
function route() {
  const first = location.hash.slice(1).split("/")[0];
  if (first === "screen" || first === "library") showView(first);

  } else { showView("files"); loadList(); }

// ---- the screen: what's on it ----------------------------------------------------------
const SCR = { state: null, frame: null, shotAt: 0, loading: false, timer: 0, fails: 0 };
const DIRS = new Set(["up", "down", "left", "right"]);
const VIDEO = new Set(["video", "live", "plex"]);

async function poll() {                                   // (in Files, now and then: just the status)
  clearTimeout(SCR.timer);
  if (document.hidden) return;
  let st = null;
  try { st = await api("/api/pi/state"); SCR.fails = 0; }
  catch (e) { SCR.fails++; }
  const files = S.view === "files";
  if (st) {
    SCR.state = st;
    drawState(st);
    if (!files) maybeShot(st);
  } else if (SCR.fails > 1) drawOffline();
  clearTimeout(SCR.timer);
  SCR.timer = setTimeout(poll, SCR.fails > 1 ? 5000 : files ? 10000 : 1500);
}
function kick(ms = 200) { clearTimeout(SCR.timer); SCR.timer = setTimeout(poll, ms); }
function maybeShot(st) {
  if (st.mode !== "media") return;                        // the terminal stays on the Pi
  const due = st.video ? Date.now() - SCR.shotAt > 4000 : st.frame !== SCR.frame;
  if (due && !SCR.loading) loadShot(st.frame);
}
function loadShot(frameNo) {
  SCR.loading = true;
  const img = new Image();
  img.alt = "What's on the Pi's screen";
  img.onload = () => {
    img.id = "shot";
    $("#shot").replaceWith(img);
    SCR.frame = frameNo; SCR.shotAt = Date.now(); SCR.loading = false;
    glowFrom(img);
  };
  img.onerror = () => { SCR.loading = false; SCR.shotAt = Date.now(); };
  img.src = "/api/pi/screen?f=" + frameNo + "&t=" + Date.now();
}

const glowPad = document.createElement("canvas");
glowPad.width = 32; glowPad.height = 18;

  } catch (e) { return; }
  let r = 0, g = 0, b = 0, w = 0;

  l = Math.min(0.6, Math.max(0.4, l));                          // a soft light, never a hole
  s = s < 0.1 ? s : Math.min(0.8, Math.max(0.45, s));

}
function hsl(r, g, b) {

}

}

let chain = Promise.resolve(), inFlight = 0;
function press(name, repeat) {

  inFlight++;

    .catch((e) => { if (!repeat) toast(e.message); })

}
async function homeButton() {

function flash(name) {
  const b = document.querySelector(`.rk[data-b="${name}"]`);

  clearTimeout(b._flash); b._flash = setTimeout(() => b.classList.remove("held"), 140);

  const name = b.dataset.b;
  if (DIRS.has(name)) b.innerHTML = ICONS.chev({ up: 0, right: 90, down: 180, left: 270 }[name]);
  let wait = 0, again = 0;
  const stop = () => { clearTimeout(wait); clearInterval(again); b.classList.remove("held"); };
  b.addEventListener("mousedown", (e) => e.preventDefault());       // the keyboard stays with the page
  b.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    try { b.setPointerCapture(e.pointerId); } catch (err) {}
    b.classList.add("held");
    if (name === "home") { homeButton(); return; }
    press(name);
    if (DIRS.has(name)) wait = setTimeout(() => { again = setInterval(() => press(name, true), 120); }, 420);
  });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) b.addEventListener(ev, stop);
  b.addEventListener("click", (e) => {                   // Enter or Space on a focused button
    if (e.detail !== 0) return;
    if (name === "home") homeButton(); else { press(name); flash(name); }
  });
}
const KEYS = {
  ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", Enter: "a",

};
document.addEventListener("keydown", (e) => {
  if (S.view === "files" || e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target;
  if (t.closest && t.closest("input, textarea, select, [contenteditable]")) return;
  const name = KEYS[e.key];
  if (!name || (SCR.state && SCR.state.mode !== "media")) return;
  if (e.key === "Enter" && t.closest && t.closest("button, a, [role=button]")) return;
  e.preventDefault();

// the rows for a folder: a list now, or a promise of one (Plex's channels, Radio Browser)
function rowsFor(tab, id) {
  const c = L.cat;
  if (POSTERS.has(tab) && id.startsWith("f")) { const f = c[tab][+id.slice(1)]; return f ? rowsOfShelf(f) : []; }
  if (tab === "streams") return c.streams.map((x) => ({ title: x[0], sub: x[1], src: x[2] }));
  if (tab === "radio") {
    if (id === "mine") return c.radio.mine.map((x) => ({ title: x[0], sub: x[1], src: x[2], kind: "radio" }));
    if (id === "picks") return c.radio.stations.map((x) => ({ title: x[0], sub: x[1], src: x[2], kind: "radio" }));
    if (id === "search") return L.fetched["radio:search"] ? L.fetched["radio:search"].rows : [];
  }
  const key = tab + ":" + id;
  if (L.fetched[key]) return L.fetched[key];
  let url;
  if (id.startsWith("plex:")) url = "/api/pi/channels?" + qs({ what: id.slice(5) });
  else if (id.startsWith("g:")) url = "/api/pi/radio?" + qs({ genre: id.slice(2) });
  else return [];
  return api(url).then((r) => {
    const rows = id.startsWith("plex:")
      ? r.channels.map((x) => ({ title: x[0], sub: x[1], src: x[2] }))
      : r.stations.map((x) => ({ title: x[0], sub: x[1], src: x[2], uuid: x[3], logo: x[4], kind: "radio" }));
    L.fetched[key] = rows;
    return rows;
  });
}
let libToken = 0;               // goes up with every drawing of the library: late answers see it moved
async function drawRows() {
  const box = $("#content"), tab = L.tab, token = ++libToken;
  const id = L.folder[tab] || "";
  const folder = foldersFor(tab).find((f) => f[0] === id);
  const shelf = POSTERS.has(tab) && (id.startsWith("f") || searchAll());   // archive.org's: pictures
  let rows;
  if (searchAll()) {
    rows = [];
    for (const f of L.cat[tab]) rows.push(...rowsOfShelf(f).map((r) => ({ ...r, sub: r.sub + " · " + f.folder })));
  } else {
    const got = rowsFor(tab, id);
    if (got instanceof Promise) {
      skeleton(box, shelf ? "posters" : "tiles", folder ? folder[1] : "");
      try { rows = await got; }
      catch (e) {
        if (token !== libToken) return;
        box.textContent = "";
        box.append(head(folder ? folder[1] : "", ""));
        if (e.message === "plex") noteInto(box, "Sign in to Plex first", "These are Plex's free Live TV channels. On the Pi: TV › Plex.");
        else noteInto(box, "Couldn't get that list", e.message);

  const title = searchAll() ? "“" + L.q.trim() + "”" : folder ? folder[1] : WHERE[tab];

  const grid = el("div", "grid " + (shelf ? "posters" : "tiles"));

// Describe: the bot looks through that camera and says what it sees, out loud on the Pi, and here
async function camDescribe(c) {
  const addr = c.addr;
  if (CAMS.said[addr] && CAMS.said[addr].busy) return;
  CAMS.said[addr] = { busy: true };
  showSaid(addr);
  let since;
  try { since = (await pi("camera", { do: "describe", addr })).since; }
  catch (e) { delete CAMS.said[addr]; showSaid(addr); toast(e.message); return; }
  const end = Date.now() + 200000;                          // (a big model waking up takes a while)
  let got = null;
  while (!got && Date.now() < end) {
    await new Promise((r) => setTimeout(r, 1500));
    try {
      const f = await api("/api/pi/friend");
      got = f.log.find((x) => x.who === "friend" && x.t >= since && (x.kind === "remark" || x.kind === "error"));
      if (got) {
        const quiet = got.kind === "error" ? "" : !(f.voice && f.voice.id) ? "Pick a voice on the Bot tab to hear it on the Pi"
          : SCR.state && SCR.state.playing ? "Not said out loud while something's playing" : "";
        CAMS.said[addr] = { text: got.text, error: got.kind === "error", note: quiet };
      }
    } catch (e) {}
  }
  if (!got) CAMS.said[addr] = { text: "It didn't answer. Try again in a moment", error: true };
  showSaid(addr);
}

}

// one camera's picture after another, then a short rest; the list again after the first round

async function refreshCams(token, was) {
  let round = 0;
  while (token === libToken && L.tab === "cameras" && !document.hidden) {
    for (const img of $$("#content .cam-pic img[data-addr]")) {
      if (token !== libToken) return;
      await loadCam(img);
    }
    if ((++round === 1 || round % 4 === 0) && token === libToken) {
      try {
        const d = await api("/api/pi/cameras");
        if (token !== libToken) return;
        if (camSig(d) !== was) return drawCameras();             // one added, gone or shown
        for (const c of d.cameras.concat(d.found)) {
          const card = $$("#content .cam[data-addr]").find((n) => n.dataset.addr === c.addr);
          if (card) card.querySelector(".cam-meta .s").textContent = camWhat(c);

    const card = img.closest(".cam");

      if (img.isConnected) img.replaceWith(next);
      CAMS.pics[next.dataset.addr] = next;
      if (card) card.classList.remove("gone");
      done();
    };
    next.onerror = () => {
      if (card) { card.classList.add("gone"); card.querySelector(".cam-msg").textContent = "Can't reach it"; }
      done();
    };
    next.src = "/api/pi/camframe?" + qs({ addr: img.dataset.addr, t: Date.now() });

// ---- adding files ----------------------------------------------------------------
function plan(list, target) {
  const jobs = [];
  // settings files: to Settings, by their own name (By type, Home, or dropped on Settings)
  if (target ? target.folder === "settings" : S.dest === "auto" || S.dest === "home") {
    const rest = [];
    for (const it of list) {
      if (!isSetting(it.file.name)) { rest.push(it); continue; }
      jobs.push({ id: S.nextId++, file: it.file, size: it.file.size, folder: "settings", path: it.file.name,
        loaded: 0, state: "waiting", error: "", el: null });
    }
    list = rest;
  }
  // a dropped folder stays together: it goes where most of its files belong
  const groups = new Map();
  for (const it of list) {
    const key = it.rel.includes("/") ? it.rel.split("/")[0] + "/" : "\u0000" + S.nextId++;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(it);
  }
  for (const [key, items] of groups) {
    let folder;
    if (target) folder = target.folder;
    else if (S.dest !== "auto") folder = S.dest;
    else if (key.startsWith("\u0000")) folder = autoFolder(items[0].file.name);
    else {
      const votes = {};
      for (const it of items) if (kindOf(it.file.name) !== "other") {
        const f = autoFolder(it.file.name);
        votes[f] = (votes[f] || 0) + 1;
      }
      folder = Object.keys(votes).sort((a, b) => votes[b] - votes[a])[0] || "documents";
    }
    for (const it of items) {
      jobs.push({
        id: S.nextId++, file: it.file, size: it.file.size, folder,
        path: join(target ? target.path : "", it.rel), loaded: 0, state: "waiting", error: "", el: null,
      });
    }
  }
  return jobs;
}
function addFiles(list, target) {
  list = list.filter((it) => !it.file.name.startsWith(".") && !SKIP.has(it.file.name.toLowerCase()));
  if (!list.length) return;
  const jobs = plan(list, target);
  S.jobs.push(...jobs);
  $("#queueWrap").hidden = false;
  for (const j of jobs) drawJob(j);
  drawOverall();
  pump();
}
async function pump() {
  if (S.running) return;
  S.running = true; S.samples = [];
  drawOverall();
  let job;
  while ((job = S.jobs.find((j) => j.state === "waiting"))) await send(job);
  S.running = false;
  drawOverall();
  await loadList();
  loadInfo();
}
async function send(job) {
  job.state = "sending"; drawJob(job);
  const disk = S.info && S.info.disk;
  if (disk && job.size > disk.free - disk.spare) {
    job.state = "failed"; job.error = "Not enough space on the Pi"; drawJob(job); drawOverall();
    return;
  }
  if (S.mode === "skip") {
    try {
      const r = await api("/api/exists?" + qs({ folder: job.folder, path: job.path }));
      if (r.exists) { job.state = "skipped"; drawJob(job); drawOverall(); return; }
    } catch (e) {}
  }
  await new Promise((resolve) => {
    const xhr = new XMLHttpRequest();
    job.xhr = xhr;
    xhr.open("PUT", "/api/upload?" + qs({ folder: job.folder, path: job.path, exists: S.mode, mtime: job.file.lastModified || "" }));
    xhr.setRequestHeader("Content-Type", "application/octet-stream");
    xhr.upload.onprogress = (e) => { job.loaded = e.loaded; progress(); };
    xhr.onload = () => {
      let r = {};
      try { r = JSON.parse(xhr.responseText); } catch (e) {}
      if (xhr.status === 200) {
        job.state = r.skipped ? "skipped" : "done"; job.loaded = job.size; job.final = r.name;
        if (disk && !r.skipped) disk.free -= job.size;
      } else {
        job.state = "failed"; job.error = r.error || "The Pi said no (" + xhr.status + ")";
      }
      done();
    };
    xhr.onerror = () => { job.state = "failed"; job.error = "Lost the connection"; done(); };
    xhr.onabort = () => { job.state = "cancelled"; done(); };
    function done() {
      job.xhr = null;
      drawJob(job); drawOverall();
      const shown = job.folder === S.folder && (job.path + "/").startsWith(S.path ? S.path + "/" : "");
      if (shown && Date.now() - S.lastRefresh > 2500) loadList();      // let new files show up as they land
      resolve();
    }
    xhr.send(job.file);
  });
}
function cancel(job) {
  if (job.state === "sending" && job.xhr) job.xhr.abort();
  else if (job.state === "waiting") { job.state = "cancelled"; drawJob(job); drawOverall(); }
}
let frame = 0;
function progress() {
  const now = performance.now();
  const sent = S.jobs.reduce((a, j) => a + (j.state === "done" ? j.size : j.state === "sending" ? j.loaded : 0), 0);
  S.samples.push([now, sent]);
  while (S.samples.length > 2 && now - S.samples[0][0] > 5000) S.samples.shift();
  if (!frame) frame = requestAnimationFrame(() => {
    frame = 0;
    for (const j of S.jobs) if (j.state === "sending") drawJob(j);
    drawOverall();
  });
}
function speed() {
  const s = S.samples;
  if (s.length < 2) return 0;
  const dt = (s[s.length - 1][0] - s[0][0]) / 1000;
  return dt > 0.5 ? (s[s.length - 1][1] - s[0][1]) / dt : 0;
}
function drawJob(j) {
  if (!j.el) {
    j.el = document.createElement("li");
    j.el.innerHTML = '<div class="l1"><span class="nm"></span><span class="st"></span><button class="x" type="button" aria-label="Cancel">' +
      ICONS.x + '</button></div><div class="l2"></div><div class="jbar"><i></i></div>';
    j.el.querySelector(".nm").textContent = j.file.name;
    j.el.querySelector(".x").onclick = () => cancel(j);
    $("#queue").append(j.el);
  }
  const f = S.info && S.info.folders.find((x) => x.key === j.folder);
  const where = (f ? f.path : LABEL[j.folder]) + "/" + (j.final ? j.path.replace(/[^/]*$/, () => j.final) : j.path);
  const pct = j.size ? Math.floor(100 * j.loaded / j.size) : 100;
  const st = {
    waiting: "Waiting", sending: pct + "%", done: "Added", skipped: "Already there",
    cancelled: "Cancelled", failed: j.error,
  }[j.state];
  j.el.className = "job " + j.state;
  j.el.querySelector(".st").textContent = st;
  j.el.querySelector(".l2").textContent = fmtSize(j.size) + " · " + where;
  j.el.querySelector(".jbar i").style.width = (j.state === "sending" ? pct : 0) + "%";
  j.el.querySelector(".x").hidden = !(j.state === "waiting" || j.state === "sending");
}
function drawOverall() {
  const n = (s) => S.jobs.filter((j) => j.state === s).length;
  const [done, failed, skipped, cancelled, waiting, sending] =
    ["done", "failed", "skipped", "cancelled", "waiting", "sending"].map(n);
  let text;
  if (waiting + sending) {
    const total = S.jobs.length - cancelled;
    const left = S.jobs.reduce((a, j) => a + (j.state === "waiting" ? j.size : j.state === "sending" ? j.size - j.loaded : 0), 0);
    const bps = speed();
    text = "Sending " + Math.min(done + failed + skipped + 1, total) + " of " + total +
      (bps ? " · " + fmtSize(bps) + "/s" : "") + (bps ? " · " + fmtLeft(left / bps) : "");
  } else {
    const bits = [];
    if (done) bits.push(done + (done === 1 ? " file added" : " files added"));
    if (skipped) bits.push(skipped + " already there");
    if (failed) bits.push(failed + " didn't make it");
    if (!bits.length && cancelled) bits.push("Cancelled");
    text = bits.join(" · ");
  }
  $("#overall").textContent = text;
  $("#retry").hidden = !(failed && !(waiting + sending));
  $("#clear").hidden = !!(waiting + sending) || !S.jobs.length;
}
$("#retry").onclick = () => {
  for (const j of S.jobs) if (j.state === "failed") { j.state = "waiting"; j.loaded = 0; j.error = ""; drawJob(j); }
  pump();
};
$("#clear").onclick = () => {
  S.jobs = S.jobs.filter((j) => {
    const keep = j.state === "waiting" || j.state === "sending";
    if (!keep && j.el) j.el.remove();
    return keep;
  });
  if (!S.jobs.length) $("#queueWrap").hidden = true;
  drawOverall();
};

  depth = 0;
  const intoBrowse = $("#browse").contains(e.target);
  dragState(null);
  const target = intoBrowse ? { folder: S.folder, path: S.path } : null;
  const picked = collect(e.dataTransfer);               // must be read before the event ends
  gather(picked).then((list) => addFiles(list, target)).catch((err) => toast("Couldn't read those: " + err.message));
});
function collect(dt) {
  const out = [];
  const items = dt.items ? Array.from(dt.items) : [];
  if (items.length && items[0].webkitGetAsEntry) {
    for (const it of items) {
      if (it.kind !== "file") continue;
      const entry = it.webkitGetAsEntry();
      if (entry) out.push({ entry });
      else { const f = it.getAsFile(); if (f) out.push({ file: f }); }
    }
  } else {
    for (const f of Array.from(dt.files || [])) out.push({ file: f });
  }
  return out;
}
function readAll(reader) {
  return new Promise((resolve, reject) => {
    const all = [];
    const next = () => reader.readEntries((batch) => {
      if (!batch.length) resolve(all);
      else { all.push(...batch); next(); }
    }, reject);
    next();
  });
}
async function walk(entry, prefix, out) {
  if (entry.isFile) {
    const file = await new Promise((res, rej) => entry.file(res, rej));
    out.push({ file, rel: prefix + file.name });
  } else if (entry.isDirectory && !entry.name.startsWith(".")) {
    for (const kid of await readAll(entry.createReader())) await walk(kid, prefix + entry.name + "/", out);
  }
}
async function gather(picked) {
  const list = [];
  for (const p of picked) {
    if (p.file) list.push({ file: p.file, rel: p.file.name });
    else await walk(p.entry, "", list);
  }
  return list;
}

// ---- start ---------------------------------------------------------------------
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  poll();
  if (L.cat && L.tab === "cameras") drawLibrary();         // the pictures again
  if (L.cat && L.tab === "friend") friendPoll(libToken, 0);  // (what you were typing stays)
});
$("#mode").value = S.mode = store.get("mode", "rename");
$("#mode").onchange = (e) => { S.mode = e.target.value; store.set("mode", S.mode); };
S.dest = store.get("dest", "auto");
if (!(S.dest in LABEL) && S.dest !== "auto") S.dest = "auto";
window.addEventListener("hashchange", route);
matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => { if (S.info) setAccent(S.info.accent); });
(async () => {
  await loadInfo();
  drawDest();
  route();
})();
</script>
